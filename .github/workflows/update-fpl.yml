name: Update FPL data

on:
  workflow_dispatch:
  schedule:
    - cron: "15 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch official FPL data
        run: |
          set -e
          mkdir -p data
          curl -fsSL --retry 3 https://fantasy.premierleague.com/api/bootstrap-static/ -o data/bootstrap.json
          curl -fsSL --retry 3 https://fantasy.premierleague.com/api/fixtures/ -o data/fixtures.json

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bootstrap.json data/fixtures.json

          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Update FPL data"
            git push
          fi
